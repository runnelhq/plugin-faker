name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # weekly: new vulnerabilities and new versions of Runnel and the SDK

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Until the Rust SDK has a release, Cargo.toml takes it from ../sdk-rust: every job checks
# out the plugin to plugin-faker/ and the SDK (main) to sdk-rust/ next to it.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-faker
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin-faker
      - uses: actions/checkout@v7
        with:
          repository: runnelhq/sdk-rust
          path: sdk-rust
      - name: Toolchain (rust-toolchain.toml) and Windows target
        run: rustup show && rustup target add x86_64-pc-windows-msvc
      - run: cargo fmt --check
      - name: Clippy (Linux)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (Windows code)
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugin-faker
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin-faker
      - uses: actions/checkout@v7
        with:
          repository: runnelhq/sdk-rust
          path: sdk-rust
      - run: rustup show
      - name: Test (the same records on Linux and Windows, testdata/rows-*.json)
        run: cargo test --all-targets

  runnel:
    name: Test against Runnel (main, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin-faker
      - uses: actions/checkout@v7
        with:
          repository: runnelhq/sdk-rust
          path: sdk-rust
      - uses: actions/checkout@v7
        with:
          repository: runnelhq/runnel
          path: runnel
      - uses: actions/setup-go@v7
        with:
          go-version-file: runnel/go.mod
          check-latest: true
      - name: Build Runnel (without editor)
        run: cd runnel && go build -o "bin/runnel$(go env GOEXE)" ./cmd/runnel
      - run: cd plugin-faker && rustup show
      - name: Test the plugin in Runnel
        run: |
          bin="$PWD/runnel/bin/runnel$(go env GOEXE)"
          # On Windows, the tests need a Windows path, not the one of Git Bash.
          if command -v cygpath >/dev/null; then bin="$(cygpath -m "$bin")"; fi
          cd plugin-faker && RUNNEL_BIN="$bin" cargo test --test with_runnel -- --nocapture

  deny:
    name: Licenses and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin-faker
      - uses: actions/checkout@v7
        with:
          repository: runnelhq/sdk-rust
          path: sdk-rust
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: plugin-faker/Cargo.toml
          command: check
